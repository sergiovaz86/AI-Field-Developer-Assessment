[project]
name = "ai-field-assessment"
version = "0.1.0"
description = "AI Field Developer Assessment: stdio MCP server and integrated FastAPI gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp==2.3.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.7.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["task1_mcp_server", "gateway_service"]

[tool.hatch.build.targets.wheel.force-include]
"gateway_service/task4_model_router/data/cl100k_base.tiktoken" = "gateway_service/task4_model_router/data/cl100k_base.tiktoken"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["task1_mcp_server", "gateway_service", "tests", "scripts"]
exclude = [".venv", ".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["gateway_service", "scripts", "task1_mcp_server"]

[tool.ruff.format]
quote-style = "double"
